<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🕹️ Arcade Salonu - Eymen</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:linear-gradient(135deg,#0d0d0d,#1a0033,#0d0d0d);
            color:#e0e0e0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            min-height:100vh;padding:10px;user-select:none;
        }
        .ust-baslik{
            text-align:center;padding:15px;
        }
        .ust-baslik h1{
            color:#ffd700;font-size:2em;text-shadow:0 0 10px gold;
        }
        .toplam-puan{
            color:#c084fc;font-size:1.1em;margin-top:5px;
        }
        .toplam-puan span{color:#ffd700;font-weight:bold;}
        .oyun-sekmeler{
            display:flex;flex-wrap:wrap;gap:8px;
            justify-content:center;margin:15px 0;
        }
        .sekme{
            background:rgba(30,10,60,0.8);border:2px solid #c084fc;
            color:#e0e0e0;padding:12px 18px;border-radius:25px;
            cursor:pointer;font-size:1em;font-weight:bold;
            transition:0.3s;text-align:center;
        }
        .sekme:hover{background:#c084fc;color:#000;transform:scale(1.05);}
        .sekme.aktif{
            background:linear-gradient(45deg,#c084fc,#ffd700);
            color:#000;border-color:#ffd700;box-shadow:0 0 15px gold;
        }
        .oyun-alani{
            background:rgba(0,0,0,0.5);border:3px solid #c084fc;
            border-radius:20px;padding:20px;min-height:500px;
            box-shadow:0 0 20px rgba(192,132,252,0.3);
            display:flex;justify-content:center;align-items:center;
        }
        .oyun-ekran{display:none;width:100%;}
        .oyun-ekran.aktif{display:block;}
        .anasayfa-btn{
            display:block;text-align:center;margin-top:15px;
            color:#c084fc;text-decoration:none;font-size:0.9em;
        }
        .anasayfa-btn:hover{color:#ffd700;}
        canvas{border-radius:10px;display:block;margin:0 auto;}
        button{
            background:#c084fc;color:#000;border:none;padding:10px 20px;
            font-size:0.9em;border-radius:8px;cursor:pointer;font-weight:bold;
            margin:5px;transition:0.3s;font-family:inherit;
        }
        button:hover{background:#ffd700;box-shadow:0 0 10px gold;}
        input,textarea{
            background:rgba(255,255,255,0.08);border:2px solid #c084fc;
            border-radius:10px;padding:10px;color:#fff;font-size:0.9em;
            width:100%;margin:5px 0;font-family:inherit;
        }
        .skor-yazi{color:#ffd700;font-size:1.2em;text-align:center;margin:10px 0;}
    </style>
</head>
<body>

    <div class="ust-baslik">
        <h1>🕹️ Eymen'in Arcade Salonu</h1>
        <p class="toplam-puan">🏆 Toplam Puan: <span id="toplamPuan">0</span></p>
    </div>

    <div class="oyun-sekmeler">
        <div class="sekme aktif" onclick="oyunDegistir(0)">🐍 Yılan</div>
        <div class="sekme" onclick="oyunDegistir(1)">🔢 2048</div>
        <div class="sekme" onclick="oyunDegistir(2)">💣 Mayın</div>
        <div class="sekme" onclick="oyunDegistir(3)">✂️ TKM</div>
        <div class="sekme" onclick="oyunDegistir(4)">🏎️ Yarış</div>
        <div class="sekme" onclick="oyunDegistir(5)">🤖 AI</div>
    </div>

    <div class="oyun-alani" id="oyunAlani">
        <!-- YILAN -->
        <div class="oyun-ekran aktif" id="oyun0">
            <canvas id="yilanCanvas" width="400" height="400"></canvas>
            <p class="skor-yazi">Skor: <span id="yilanSkor">0</span></p>
            <button onclick="yilanBaslat()">🔄 Başla</button>
        </div>

        <!-- 2048 -->
        <div class="oyun-ekran" id="oyun1">
            <div id="oyun2048Alani" style="display:grid;grid-template-columns:repeat(4,70px);grid-template-rows:repeat(4,70px);gap:8px;justify-content:center;"></div>
            <p class="skor-yazi">Skor: <span id="s2048Skor">0</span> | En İyi: <span id="s2048EnIyi">0</span></p>
            <button onclick="oyun2048Baslat()">🔄 Yeni Oyun</button>
        </div>

        <!-- MAYIN TARLASI -->
        <div class="oyun-ekran" id="oyun2">
            <div id="mayinAlani" style="display:grid;grid-template-columns:repeat(10,35px);grid-template-rows:repeat(10,35px);gap:1px;justify-content:center;"></div>
            <p class="skor-yazi">💣 <span id="mayinSayac">15</span> | ⏱️ <span id="mayinZaman">0</span></p>
            <button onclick="mayinBaslat()">🔄 Yeni Oyun</button>
        </div>

        <!-- TAŞ KAĞIT MAKAS -->
        <div class="oyun-ekran" id="oyun3">
            <div style="text-align:center;">
                <div style="font-size:4em;display:flex;justify-content:center;gap:30px;margin:20px 0;">
                    <span id="tkmSen">❓</span><span style="color:#ffd700;">VS</span><span id="tkmPc">❓</span>
                </div>
                <p class="skor-yazi">Sen: <span id="tkmSenSkor">0</span> - PC: <span id="tkmPcSkor">0</span></p>
                <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                    <button onclick="tkmOyna('tas')" style="font-size:2em;">🪨</button>
                    <button onclick="tkmOyna('kagit')" style="font-size:2em;">📄</button>
                    <button onclick="tkmOyna('makas')" style="font-size:2em;">✂️</button>
                </div>
                <p id="tkmSonuc" style="color:#ffd700;margin-top:10px;"></p>
                <button onclick="tkmSifirla()">🔄 Sıfırla</button>
            </div>
        </div>

        <!-- YARIŞ -->
        <div class="oyun-ekran" id="oyun4">
            <canvas id="yarisCanvas" width="350" height="500"></canvas>
            <p class="skor-yazi">Skor: <span id="yarisSkor">0</span> | En İyi: <span id="yarisEnIyi">0</span></p>
            <button onclick="yarisBaslat()">🔄 Başla</button>
        </div>

        <!-- YAPAY ZEKA -->
        <div class="oyun-ekran" id="oyun5">
            <div style="max-width:400px;margin:0 auto;background:rgba(0,0,0,0.3);border-radius:15px;padding:15px;min-height:300px;">
                <div id="aiMesajlar" style="max-height:250px;overflow-y:auto;margin-bottom:10px;"></div>
                <div style="display:flex;gap:5px;">
                    <input type="text" id="aiInput" placeholder="Bir şey yaz..." onkeydown="if(event.key==='Enter')aiGonder()">
                    <button onclick="aiGonder()">📤</button>
                </div>
            </div>
        </div>
    </div>

    <a href="index.html" class="anasayfa-btn">🏠 Ana Sayfaya Dön</a>

    <script>
        // ==================== ORTAK DEĞİŞKENLER ====================
        let toplamPuan = parseInt(localStorage.getItem("arcadeToplam") || "0");
        document.getElementById("toplamPuan").innerText = toplamPuan;
        let aktifOyun = 0;

        function puanEkle(p) {
            toplamPuan += p;
            localStorage.setItem("arcadeToplam", toplamPuan);
            document.getElementById("toplamPuan").innerText = toplamPuan;
        }

        function oyunDegistir(index) {
            aktifOyun = index;
            document.querySelectorAll(".sekme").forEach((s,i) => s.classList.toggle("aktif", i===index));
            document.querySelectorAll(".oyun-ekran").forEach((o,i) => o.classList.toggle("aktif", i===index));
            if (index === 4) yarisBaslat();
            if (index === 0) yilanBaslat();
        }

        // ==================== 1. YILAN ====================
        let yilanCanvas, yilanCtx, yilan, yilanYon, yilanYem, yilanSkor, yilanDongu, yilanHiz=150;
        function yilanBaslat() {
            yilanCanvas = document.getElementById("yilanCanvas");
            yilanCtx = yilanCanvas.getContext("2d");
            yilan = [{x:10,y:10}]; yilanYon={x:1,y:0}; yilanSkor=0;
            document.getElementById("yilanSkor").innerText="0";
            yilanYemOlustur();
            if(yilanDongu) clearInterval(yilanDongu);
            yilanDongu=setInterval(yilanAdim, yilanHiz);
            document.addEventListener("keydown", yilanKlavye);
        }
        function yilanYemOlustur(){
            do{yilanYem={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};}
            while(yilan.some(p=>p.x===yilanYem.x&&p.y===yilanYem.y));
        }
        function yilanAdim(){
            let b={x:yilan[0].x+yilanYon.x, y:yilan[0].y+yilanYon.y};
            if(b.x<0||b.x>=20||b.y<0||b.y>=20||yilan.some(p=>p.x===b.x&&p.y===b.y)){clearInterval(yilanDongu);alert("Oyun Bitti! Skor: "+yilanSkor);puanEkle(yilanSkor);return;}
            yilan.unshift(b);
            if(b.x===yilanYem.x&&b.y===yilanYem.y){yilanSkor+=10;document.getElementById("yilanSkor").innerText=yilanSkor;yilanYemOlustur();}
            else{yilan.pop();}
            yilanCiz();
        }
        function yilanCiz(){
            yilanCtx.fillStyle="#111";yilanCtx.fillRect(0,0,400,400);
            yilanCtx.fillStyle="#c084fc";yilan.forEach(p=>yilanCtx.fillRect(p.x*20,p.y*20,18,18));
            yilanCtx.fillStyle="#ffd700";yilanCtx.beginPath();yilanCtx.arc(yilanYem.x*20+10,yilanYem.y*20+10,9,0,Math.PI*2);yilanCtx.fill();
        }
        function yilanKlavye(e){
            if(e.key==="ArrowUp"&&yilanYon.y===0)yilanYon={x:0,y:-1};
            if(e.key==="ArrowDown"&&yilanYon.y===0)yilanYon={x:0,y:1};
            if(e.key==="ArrowLeft"&&yilanYon.x===0)yilanYon={x:-1,y:0};
            if(e.key==="ArrowRight"&&yilanYon.x===0)yilanYon={x:1,y:0};
        }

        // ==================== 2. 2048 ====================
        let t2048,skor2048,enIyi2048,bitti2048;
        if(localStorage.getItem("enIyi2048Arcade"))enIyi2048=parseInt(localStorage.getItem("enIyi2048Arcade"));
        else enIyi2048=0;
        document.getElementById("s2048EnIyi").innerText=enIyi2048;
        function oyun2048Baslat(){
            t2048=Array(16).fill(0);skor2048=0;bitti2048=false;
            document.getElementById("s2048Skor").innerText="0";
            rastgeleEkle2048();rastgeleEkle2048();
            tahtayiCiz2048();
        }
        function rastgeleEkle2048(){
            let b=[];for(let i=0;i<16;i++)if(t2048[i]===0)b.push(i);
            if(b.length===0)return;
            t2048[b[Math.floor(Math.random()*b.length)]]=Math.random()<0.9?2:4;
        }
        function tahtayiCiz2048(){
            const a=document.getElementById("oyun2048Alani");a.innerHTML="";
            const r={2:"#eee4da",4:"#ede0c8",8:"#f2b179",16:"#f59563",32:"#f67c5f",64:"#f65e3b",128:"#edcf72",256:"#edcc61",512:"#edc850",1024:"#edc53f",2048:"#edc22e"};
            t2048.forEach((d,i)=>{
                const h=document.createElement("div");
                h.style.cssText=`background:${d?r[d]||"#ff4d4d":"rgba(255,255,255,0.05)"};border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1.3em;color:${d<=4?"#776e65":"#fff"};`;
                h.innerText=d||"";a.appendChild(h);
            });
            document.getElementById("s2048Skor").innerText=skor2048;
            if(skor2048>enIyi2048){enIyi2048=skor2048;localStorage.setItem("enIyi2048Arcade",enIyi2048);document.getElementById("s2048EnIyi").innerText=enIyi2048;}
        }
        function kaydir2048(yon){
            if(bitti2048)return;
            let once=[...t2048];
            if(yon==="sol")for(let r=0;r<16;r+=4){let s=[t2048[r],t2048[r+1],t2048[r+2],t2048[r+3]];let y=kbd2048(s);for(let i=0;i<4;i++)t2048[r+i]=y[i];}
            else if(yon==="sag")for(let r=0;r<16;r+=4){let s=[t2048[r+3],t2048[r+2],t2048[r+1],t2048[r]];let y=kbd2048(s).reverse();for(let i=0;i<4;i++)t2048[r+i]=y[i];}
            else if(yon==="yukari")for(let c=0;c<4;c++){let s=[t2048[c],t2048[c+4],t2048[c+8],t2048[c+12]];let y=kbd2048(s);for(let i=0;i<4;i++)t2048[c+i*4]=y[i];}
            else if(yon==="asagi")for(let c=0;c<4;c++){let s=[t2048[c+12],t2048[c+8],t2048[c+4],t2048[c]];let y=kbd2048(s).reverse();for(let i=0;i<4;i++)t2048[c+i*4]=y[i];}
            if(JSON.stringify(once)!==JSON.stringify(t2048)){rastgeleEkle2048();tahtayiCiz2048();}
        }
        function kbd2048(d){let y=d.filter(x=>x!==0),b=[],i=0;while(i<y.length){if(i<y.length-1&&y[i]===y[i+1]){b.push(y[i]*2);skor2048+=y[i]*2;i+=2;}else{b.push(y[i]);i++;}}while(b.length<4)b.push(0);return b;}
        document.addEventListener("keydown",function(e){
            if(aktifOyun!==1)return;
            if(e.key==="ArrowLeft"){e.preventDefault();kaydir2048("sol");}
            if(e.key==="ArrowRight"){e.preventDefault();kaydir2048("sag");}
            if(e.key==="ArrowUp"){e.preventDefault();kaydir2048("yukari");}
            if(e.key==="ArrowDown"){e.preventDefault();kaydir2048("asagi");}
        });

        // ==================== 3. MAYIN TARLASI ====================
        let mTahta=[],mAcik=[],mBayrak=[],mBitti=false,mZaman=0,mTimer=null,mayinSayisi=15;
        function mayinBaslat(){
            mTahta=Array(100).fill(0);mAcik=Array(100).fill(false);mBayrak=Array(100).fill(false);
            mBitti=false;mZaman=0;mayinSayisi=15;
            document.getElementById("mayinSayac").innerText=mayinSayisi;document.getElementById("mayinZaman").innerText="0";
            if(mTimer)clearInterval(mTimer);mTimer=null;
            let m=0;while(m<15){let r=Math.floor(Math.random()*100);if(mTahta[r]!==-1){mTahta[r]=-1;m++;}}
            for(let i=0;i<100;i++){if(mTahta[i]===-1)continue;let s=0;mayinKomsu(i).forEach(k=>{if(mTahta[k]===-1)s++;});mTahta[i]=s;}
            mayinCiz();
        }
        function mayinKomsu(i){let sat=Math.floor(i/10),sut=i%10,k=[];for(let r=-1;r<=1;r++)for(let c=-1;c<=1;c++){if(r===0&&c===0)continue;let ns=sat+r,nu=sut+c;if(ns>=0&&ns<10&&nu>=0&&nu<10)k.push(ns*10+nu);}return k;}
        function mayinAc(i){
            if(mBitti||mAcik[i]||mBayrak[i])return;
            if(!mTimer){mTimer=setInterval(()=>{mZaman++;document.getElementById("mayinZaman").innerText=mZaman;},1000);}
            mAcik[i]=true;
            if(mTahta[i]===-1){mBitti=true;clearInterval(mTimer);alert("💥 Mayına bastın!");mayinCiz();return;}
            if(mTahta[i]===0){mayinKomsu(i).forEach(k=>mayinAc(k));}
            if(mAcik.filter(a=>a).length===85){mBitti=true;clearInterval(mTimer);alert("🎉 Kazandın!");puanEkle(100);}
            mayinCiz();
        }
        function mayinBayrak(i){
            if(mBitti||mAcik[i])return;
            mBayrak[i]=!mBayrak[i];
            let k=15;mBayrak.forEach(b=>{if(b)k--;});
            document.getElementById("mayinSayac").innerText=k;
            mayinCiz();
        }
        function mayinCiz(){
            const a=document.getElementById("mayinAlani");a.innerHTML="";
            for(let i=0;i<100;i++){
                const h=document.createElement("div");
                h.style.cssText="width:35px;height:35px;background:rgba(255,255,255,0.08);border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:0.8em;cursor:pointer;";
                if(mAcik[i]){h.style.background="rgba(0,0,0,0.4)";if(mTahta[i]===-1)h.innerText="💣";else if(mTahta[i]>0)h.innerText=mTahta[i];}
                else if(mBayrak[i]){h.innerText="🚩";h.style.background="rgba(255,215,0,0.3)";}
                h.onclick=()=>mayinAc(i);
                h.oncontextmenu=(e)=>{e.preventDefault();mayinBayrak(i);};
                a.appendChild(h);
            }
        }

        // ==================== 4. TAŞ KAĞIT MAKAS ====================
        let tkmSenP=0,tkmPcP=0,tkmBitti=false;
        function tkmOyna(secim){
            if(tkmBitti)return;
            const s=["tas","kagit","makas"],pc=s[Math.floor(Math.random()*3)];
            document.getElementById("tkmSen").innerText={tas:"🪨",kagit:"📄",makas:"✂️"}[secim];
            document.getElementById("tkmPc").innerText={tas:"🪨",kagit:"📄",makas:"✂️"}[pc];
            let sonuc="";
            if(secim===pc)sonuc="🤝 Berabere!";
            else if((secim==="tas"&&pc==="makas")||(secim==="kagit"&&pc==="tas")||(secim==="makas"&&pc==="kagit")){sonuc="✅ Kazandın!";tkmSenP++;}
            else{sonuc="❌ Kaybettin!";tkmPcP++;}
            document.getElementById("tkmSenSkor").innerText=tkmSenP;
            document.getElementById("tkmPcSkor").innerText=tkmPcP;
            document.getElementById("tkmSonuc").innerText=sonuc;
            if(tkmSenP===5){tkmBitti=true;document.getElementById("tkmSonuc").innerText="🎉 Oyunu kazandın!";puanEkle(50);}
            if(tkmPcP===5){tkmBitti=true;document.getElementById("tkmSonuc").innerText="😢 Bilgisayar kazandı.";}
        }
        function tkmSifirla(){tkmSenP=0;tkmPcP=0;tkmBitti=false;document.getElementById("tkmSenSkor").innerText="0";document.getElementById("tkmPcSkor").innerText="0";document.getElementById("tkmSonuc").innerText="";document.getElementById("tkmSen").innerText="❓";document.getElementById("tkmPc").innerText="❓";}

        // ==================== 5. YARIŞ ====================
        let yCanvas,yCtx,yAraba,yRakipler,yAltinlar,ySkor=0,yEnIyi=0,yBitti=false,yAnimasyon,yYolOfset=0,yZorluk=1,yRakipSure=0,yAltinSure=0,yTuslar={};
        if(localStorage.getItem("yarisEnIyiArcade"))yEnIyi=parseInt(localStorage.getItem("yarisEnIyiArcade"));
        document.getElementById("yarisEnIyi").innerText=yEnIyi;
        window.addEventListener("keydown",e=>{yTuslar[e.key]=true;});
        window.addEventListener("keyup",e=>{yTuslar[e.key]=false;});
        function yarisBaslat(){
            yCanvas=document.getElementById("yarisCanvas");yCtx=yCanvas.getContext("2d");
            yAraba={x:155,y:430,w:40,h:70};yRakipler=[];yAltinlar=[];ySkor=0;yBitti=false;
            yYolOfset=0;yZorluk=1;yRakipSure=0;yAltinSure=0;
            document.getElementById("yarisSkor").innerText="0";
            if(yAnimasyon)cancelAnimationFrame(yAnimasyon);
            yarisDongu();
        }
        function yarisDongu(){
            if(yBitti)return;
            if(yTuslar["ArrowLeft"]){yAraba.x-=6;if(yAraba.x<40)yAraba.x=40;}
            if(yTuslar["ArrowRight"]){yAraba.x+=6;if(yAraba.x>270)yAraba.x=270;}
            ySkor++;document.getElementById("yarisSkor").innerText=ySkor;
            yZorluk=1+Math.floor(ySkor/300);
            yYolOfset+=3+yZorluk;if(yYolOfset>40)yYolOfset=0;
            yRakipSure++;if(yRakipSure>Math.max(30,80-yZorluk*5)){yRakipler.push({x:40+Math.random()*230,y:-80,w:40,h:70,s:2+Math.random()*yZorluk});yRakipSure=0;}
            yAltinSure++;if(yAltinSure>60){yAltinlar.push({x:40+Math.random()*250,y:-20,w:20,h:20});yAltinSure=0;}
            for(let i=yRakipler.length-1;i>=0;i--){yRakipler[i].y+=yRakipler[i].s;if(yCarpisma(yAraba,yRakipler[i])){yarisBitir();return;}if(yRakipler[i].y>550)yRakipler.splice(i,1);}
            for(let i=yAltinlar.length-1;i>=0;i--){yAltinlar[i].y+=3;if(yCarpisma(yAraba,yAltinlar[i])){ySkor+=50;document.getElementById("yarisSkor").innerText=ySkor;yAltinlar.splice(i,1);}else if(yAltinlar[i].y>550)yAltinlar.splice(i,1);}
            yarisCiz();
            yAnimasyon=requestAnimationFrame(yarisDongu);
        }
        function yCarpisma(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
        function yarisCiz(){
            yCtx.fillStyle="#1a3a1a";yCtx.fillRect(0,0,350,550);
            yCtx.fillStyle="#333";yCtx.fillRect(40,0,270,550);
            yCtx.fillStyle="#ff4444";yCtx.fillRect(36,0,4,550);yCtx.fillRect(310,0,4,550);
            yCtx.fillStyle="#ffd700";for(let y=-40+yYolOfset;y<550;y+=40)yCtx.fillRect(173,y,4,20);
            yAltinlar.forEach(a=>{yCtx.fillStyle="#ffd700";yCtx.beginPath();yCtx.arc(a.x+10,a.y+10,10,0,Math.PI*2);yCtx.fill();});
            yRakipler.forEach(r=>{yCtx.fillStyle="#ff3333";yCtx.fillRect(r.x+3,r.y+8,34,54);yCtx.fillStyle="#cc0000";yCtx.fillRect(r.x+8,r.y+12,24,25);yCtx.fillStyle="#111";yCtx.fillRect(r.x,r.y+12,6,14);yCtx.fillRect(r.x+34,r.y+12,6,14);yCtx.fillRect(r.x,r.y+44,6,14);yCtx.fillRect(r.x+34,r.y+44,6,14);});
            yCtx.fillStyle="#4488ff";yCtx.fillRect(yAraba.x+3,yAraba.y+8,34,54);yCtx.fillStyle="#2266dd";yCtx.fillRect(yAraba.x+8,yAraba.y+12,24,25);yCtx.fillStyle="#111";yCtx.fillRect(yAraba.x,yAraba.y+12,6,14);yCtx.fillRect(yAraba.x+34,yAraba.y+12,6,14);yCtx.fillRect(yAraba.x,yAraba.y+44,6,14);yCtx.fillRect(yAraba.x+34,yAraba.y+44,6,14);
        }
        function yarisBitir(){
            yBitti=true;cancelAnimationFrame(yAnimasyon);
            if(ySkor>yEnIyi){yEnIyi=ySkor;localStorage.setItem("yarisEnIyiArcade",yEnIyi);document.getElementById("yarisEnIyi").innerText=yEnIyi;}
            puanEkle(Math.floor(ySkor/10));
            alert("💥 Oyun Bitti! Skor: "+ySkor);
        }

        // ==================== 6. YAPAY ZEKA ====================
        const aiBilgi = {
            "merhaba":["Selam! 👋","Merhaba!","Hey!"],
            "nasılsın":["İyiyim, sen?","Süper!","Harika!"],
            "oyun":["Yılan 🐍, 2048 🔢, Mayın 💣, TKM ✂️, Yarış 🏎️"],
            "eymen":["Bu sitenin sahibi, efsane biri!"],
        };
        function aiGonder(){
            const i=document.getElementById("aiInput");const m=i.value.trim();
            if(!m)return;
            aiMesajEkle(m,"sen");
            i.value="";
            setTimeout(()=>{
                let c="Anlamadım, başka bir şey sor.";
                for(let a in aiBilgi){if(m.toLowerCase().includes(a)){c=aiBilgi[a][Math.floor(Math.random()*aiBilgi[a].length)];break;}}
                aiMesajEkle(c,"bot");
            },500+Math.random()*1000);
        }
        function aiMesajEkle(m,k){
            const d=document.getElementById("aiMesajlar");
            const e=document.createElement("div");
            e.style.cssText=`padding:8px 12px;margin:5px;border-radius:10px;max-width:80%;${k==="sen"?"background:rgba(255,215,0,0.2);color:#ffd700;margin-left:auto;":"background:rgba(192,132,252,0.2);color:#e0e0e0;"}`;
            e.innerText=(k==="bot"?"🤖 ":"👤 ")+m;
            d.appendChild(e);d.scrollTop=d.scrollHeight;
        }

        // ==================== BAŞLAT ====================
        yilanBaslat();
        oyun2048Baslat();
        mayinBaslat();
        yarisBaslat();
        aiMesajEkle("Selam! Ben Eymen'in asistanıyım. Sana nasıl yardımcı olabilirim?","bot");
    </script>
