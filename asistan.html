<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Eymen'in Asistanı</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:linear-gradient(135deg,#0d0d0d,#1a0033,#0d0d0d);
            display:flex;justify-content:center;align-items:center;
            height:100vh;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            flex-direction:column;color:#e0e0e0;
        }
        h1{color:#ffd700;text-shadow:0 0 10px gold;margin-bottom:20px;}
        .chat-kutu{
            width:400px;max-width:90%;background:rgba(0,0,0,0.7);
            border:3px solid #c084fc;border-radius:20px;
            box-shadow:0 0 30px rgba(192,132,252,0.4);
            overflow:hidden;
        }
        .chat-ust{
            background:rgba(30,10,60,0.9);padding:15px;
            text-align:center;border-bottom:2px solid #c084fc;
            color:#ffd700;font-weight:bold;font-size:1.2em;
        }
        .chat-mesajlar{
            height:400px;overflow-y:auto;padding:15px;
            display:flex;flex-direction:column;gap:10px;
        }
        .mesaj{max-width:80%;padding:10px 15px;border-radius:15px;word-wrap:break-word;}
        .mesaj-bot{background:rgba(192,132,252,0.2);align-self:flex-start;color:#e0e0e0;}
        .mesaj-sen{background:rgba(255,215,0,0.2);align-self:flex-end;color:#ffd700;}
        .chat-input{
            display:flex;border-top:2px solid #c084fc;
        }
        .chat-input input{
            flex:1;padding:15px;background:rgba(255,255,255,0.05);
            border:none;color:#fff;font-size:1em;outline:none;
        }
        .chat-input button{
            background:#c084fc;color:#000;border:none;
            padding:15px 20px;font-weight:bold;cursor:pointer;
            transition:0.3s;
        }
        .chat-input button:hover{background:#ffd700;}
        .anasayfa{
            margin-top:20px;color:#c084fc;text-decoration:none;
            font-size:0.9em;
        }
        .anasayfa:hover{color:#ffd700;}
    </style>
</head>
<body>
    <h1>🤖 Eymen'in Yapay Zekası</h1>
    <div class="chat-kutu">
        <div class="chat-ust">🤖 Babapiro AI</div>
        <div class="chat-mesajlar" id="mesajlar">
            <div class="mesaj mesaj-bot">
                🤖 Selam! Ben Eymen'in asistanıyım. Bana istediğini sorabilirsin! 
                <br><br>📝 Ne yapabilirim?
                <br>🗣️ Sohbet edebilirim
                <br>🎮 Oyun önerebilirim
                <br>📊 Bilgi verebilirim
                <br>😂 Espri yapabilirim
                <br><br>Hadi başlayalım!
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="kullaniciInput" placeholder="Bir şey yaz..." onkeydown="if(event.key==='Enter')mesajGonder()">
            <button onclick="mesajGonder()">📤 Gönder</button>
        </div>
    </div>
    <a href="index.html" class="anasayfa">🏠 Ana Sayfaya Dön</a>

    <script>
        // Yapay zeka bilgi bankası
        const bilgiBankasi = {
            "merhaba": ["Selam! 👋", "Merhaba, hoş geldin!", "Hey! Nasılsın?"],
            "selam": ["Selam! 👋", "Merhaba!", "Heyyy!"],
            "nasılsın": ["İyiyim, teşekkür ederim! Sen nasılsın?", "Süper! Seni gördüğüme sevindim.", "Harikayım! Sen?"],
            "iyiyim": ["Güzel! Sana nasıl yardımcı olabilirim?", "Sevindim! Ne yapmak istersin?"],
            "adın ne": ["Ben Babapiro AI! Eymen'in yapay zeka asistanıyım.", "Bana Babapiro AI derler 😎"],
            "kimsin": ["Ben Eymen'in özel yapay zeka asistanıyım. Sana yardım etmek için buradayım!"],
            "oyun": ["🎮 Oyun mu istiyorsun? Yılan oyunu, 2048, Mayın Tarlası veya Taş Kağıt Makas var!", "Hangi oyunu önereyim? Yılan 🐍, 2048 🔢, Mayın Tarlası 💣, Taş Kağıt Makas ✂️"],
            "yılan": ["🐍 Yılan oyunu efsanedir! Ana sayfadan oynayabilirsin."],
            "2048": ["🔢 2048 bağımlılık yapar! Sayıları birleştir, 2048'e ulaş!"],
            "mayın": ["💣 Mayın Tarlası klasiktir! Dikkatli ol, mayına basma!"],
            "taş kağıt makas": ["✂️ Bilgisayara karşı oyna, ilk 5 puanı alan kazanır!"],
            "eymen": ["Eymen Yağız Biçer! Bu sitenin sahibi, dünyanın en babapiro insanı! 😎"],
            "brawl stars": ["⭐ Eymen'in 64.522 kupası var! Bea favori karakteri. Kulüp: ~|IMPARATORS|~"],
            "valorant": ["🔫 Riot ID: Kendrick Lamar#Eymen. Efsane skinler onda!"],
            "espri": ["😂 Neden bilgisayar doktora gitmiş? Virüs kapmış! 🤣", "😄 Yılan oyununda yılan neden kızmış? Çünkü kuyruğuna basmışlar!"],
            "şaka": ["😂 Neden bilgisayar doktora gitmiş? Virüs kapmış! 🤣", "😄 Yılan oyununda yılan neden kızmış? Çünkü kuyruğuna basmışlar!"],
            "teşekkür": ["Rica ederim! 😊", "Ne demek, her zaman! 💪", "Ben teşekkür ederim! 🫶"],
            "sağol": ["Rica ederim! 😊", "Ne demek, her zaman! 💪"],
            "görüşürüz": ["Görüşürüz! 👋", "Bay bay! 😊", "Kendine iyi bak! 🫶"],
            "bye": ["Görüşürüz! 👋", "Bay bay! 😊"],
        };

        function mesajGonder() {
            const input = document.getElementById("kullaniciInput");
            const mesaj = input.value.trim();
            if (!mesaj) return;

            // Kullanıcı mesajını ekle
            mesajEkle(mesaj, "sen");
            input.value = "";

            // Bot cevabını bul
            setTimeout(() => {
                const cevap = cevapBul(mesaj.toLowerCase());
                mesajEkle(cevap, "bot");
            }, 500 + Math.random() * 1000);
        }

        function cevapBul(mesaj) {
            // Tam eşleşme ara
            for (let anahtar in bilgiBankasi) {
                if (mesaj.includes(anahtar)) {
                    const cevaplar = bilgiBankasi[anahtar];
                    return "🤖 " + cevaplar[Math.floor(Math.random() * cevaplar.length)];
                }
            }

            // Hiçbir şey bulamazsa
            const varsayilan = [
                "🤔 Bunu tam anlayamadım. Başka bir şey sorar mısın?",
                "😅 Üzgünüm, bu konuda pek bilgim yok. Ama oyunlar hakkında soru sorabilirsin!",
                "📝 'Oyun', 'Espri', 'Eymen', 'Valorant', 'Brawl Stars' gibi şeyler sorabilirsin!",
                "🧠 Öğreniyorum! Bana yeni şeyler öğretmek ister misin?",
            ];
            return varsayilan[Math.floor(Math.random() * varsayilan.length)];
        }

        function mesajEkle(metin, kim) {
            const mesajlar = document.getElementById("mesajlar");
            const div = document.createElement("div");
            div.classList.add("mesaj");
            div.classList.add(kim === "bot" ? "mesaj-bot" : "mesaj-sen");
            div.innerText = metin;
            mesajlar.appendChild(div);
            mesajlar.scrollTop = mesajlar.scrollHeight;
        }
    </script>
</body>
</html>
