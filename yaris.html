<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🏎️ Yarış Oyunu - Eymen</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:linear-gradient(135deg,#0d0d0d,#1a0033,#0d0d0d);
            display:flex;justify-content:center;align-items:center;
            height:100vh;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            flex-direction:column;color:#e0e0e0;user-select:none;overflow:hidden;
        }
        h1{color:#ffd700;text-shadow:0 0 10px gold;margin-bottom:5px;font-size:1.8em;}
        .ust-bilgi{display:flex;gap:30px;margin-bottom:10px;font-size:1.1em;}
        .skor{color:#ffd700;font-weight:bold;}
        .eniyi{color:#c084fc;}
        canvas{
            border:3px solid #c084fc;border-radius:15px;
            box-shadow:0 0 20px rgba(192,132,252,0.4);
            background:#222;display:block;
        }
        button{
            background:#c084fc;color:#000;border:none;padding:12px 30px;
            font-size:1.1em;border-radius:8px;cursor:pointer;font-weight:bold;
            margin-top:12px;transition:0.3s;
        }
        button:hover{background:#ffd700;box-shadow:0 0 15px gold;}
        p{color:#aaa;font-size:0.8em;margin-top:5px;}
    </style>
</head>
<body>
    <h1>🏎️ Yarış Oyunu</h1>
    <div class="ust-bilgi">
        <span>🏆 Skor: <span class="skor" id="skor">0</span></span>
        <span>👑 En İyi: <span class="eniyi" id="eniyi">0</span></span>
    </div>
    <canvas id="oyunCanvas" width="350" height="550"></canvas>
    <button onclick="oyunuBaslat()">🔄 Yeniden Başla</button>
    <p>← → Ok tuşları / Parmak kaydırma | Altın topla, arabalardan kaç!</p>

    <script>
        const canvas = document.getElementById("oyunCanvas");
        const ctx = canvas.getContext("2d");
        const W = canvas.width;
        const H = canvas.height;

        // Yol sınırları
        const YOL_SOL = 40;
        const YOL_SAG = 310;
        const YOL_GENISLIK = YOL_SAG - YOL_SOL;

        // Araba
        let araba = {
            x: 155,
            y: 430,
            genislik: 40,
            yukseklik: 70,
            hiz: 6
        };

        let rakipler = [];
        let altinlar = [];
        let skor = 0;
        let enIyi = 0;
        let oyunBitti = false;
        let animasyon;
        let yolCizgisiOffset = 0;
        let zorlukSeviyesi = 1;
        let rakipOlusumSuresi = 0;
        let altinOlusumSuresi = 0;

        // En iyi skor
        if (localStorage.getItem("yarisEnIyi2")) {
            enIyi = parseInt(localStorage.getItem("yarisEnIyi2"));
        }
        document.getElementById("eniyi").innerText = enIyi;

        // Klavye kontrolü
        const tuslar = {};
        window.addEventListener("keydown", e => { tuslar[e.key] = true; e.preventDefault(); });
        window.addEventListener("keyup", e => { tuslar[e.key] = false; e.preventDefault(); });

        // Dokunmatik kontrol
        let dokunmaAktif = false;
        let dokunmaX = 0;

        canvas.addEventListener("touchstart", e => {
            e.preventDefault();
            dokunmaAktif = true;
            dokunmaX = e.touches[0].clientX;
        });
        canvas.addEventListener("touchmove", e => {
            e.preventDefault();
            if (dokunmaAktif) {
                const canvasRect = canvas.getBoundingClientRect();
                const yeniX = e.touches[0].clientX - canvasRect.left;
                araba.x = yeniX - araba.genislik / 2;
                sinirKontrol();
            }
        });
        canvas.addEventListener("touchend", e => {
            e.preventDefault();
            dokunmaAktif = false;
        });

        function sinirKontrol() {
            if (araba.x < YOL_SOL) araba.x = YOL_SOL;
            if (araba.x + araba.genislik > YOL_SAG) araba.x = YOL_SAG - araba.genislik;
        }

        function carpismaVar(a, b) {
            // Daha hassas çarpışma
            const marj = 8;
            return a.x + marj < b.x + b.genislik - marj &&
                   a.x + a.genislik - marj > b.x + marj &&
                   a.y + marj < b.y + b.yukseklik - marj &&
                   a.y + a.yukseklik - marj > b.y + marj;
        }

        function yeniRakip() {
            const x = YOL_SOL + Math.random() * (YOL_GENISLIK - 40);
            return {
                x: x,
                y: -80,
                genislik: 40,
                yukseklik: 70,
                hiz: 2 + Math.random() * zorlukSeviyesi
            };
        }

        function yeniAltin() {
            const x = YOL_SOL + Math.random() * (YOL_GENISLIK - 20);
            return {
                x: x,
                y: -30,
                genislik: 20,
                yukseklik: 20
            };
        }

        function oyunuBaslat() {
            araba.x = 155;
            araba.y = 430;
            rakipler = [];
            altinlar = [];
            skor = 0;
            oyunBitti = false;
            yolCizgisiOffset = 0;
            zorlukSeviyesi = 1;
            rakipOlusumSuresi = 0;
            altinOlusumSuresi = 0;
            document.getElementById("skor").innerText = "0";
            if (animasyon) cancelAnimationFrame(animasyon);
            oyunDongusu();
        }

        function oyunDongusu() {
            if (oyunBitti) return;

            // Hareket
            if (tuslar["ArrowLeft"] || tuslar["a"] || tuslar["A"]) {
                araba.x -= araba.hiz;
            }
            if (tuslar["ArrowRight"] || tuslar["d"] || tuslar["D"]) {
                araba.x += araba.hiz;
            }
            sinirKontrol();

            // Skor
            skor++;
            document.getElementById("skor").innerText = skor;

            // Zorluk artışı
            zorlukSeviyesi = 1 + Math.floor(skor / 300);

            // Yol çizgisi
            yolCizgisiOffset += 3 + zorlukSeviyesi;
            if (yolCizgisiOffset > 40) yolCizgisiOffset = 0;

            // Rakip oluştur
            rakipOlusumSuresi++;
            const rakipAraligi = Math.max(30, 80 - zorlukSeviyesi * 5);
            if (rakipOlusumSuresi > rakipAraligi) {
                rakipler.push(yeniRakip());
                rakipOlusumSuresi = 0;
            }

            // Altın oluştur
            altinOlusumSuresi++;
            if (altinOlusumSuresi > 60) {
                altinlar.push(yeniAltin());
                altinOlusumSuresi = 0;
            }

            // Rakipleri güncelle
            for (let i = rakipler.length - 1; i >= 0; i--) {
                rakipler[i].y += rakipler[i].hiz;
                
                if (carpismaVar(araba, rakipler[i])) {
                    oyunuBitir();
                    return;
                }
                
                if (rakipler[i].y > H + 100) {
                    rakipler.splice(i, 1);
                }
            }

            // Altınları güncelle
            for (let i = altinlar.length - 1; i >= 0; i--) {
                altinlar[i].y += 3 + zorlukSeviyesi * 0.5;
                
                if (carpismaVar(araba, altinlar[i])) {
                    skor += 50;
                    document.getElementById("skor").innerText = skor;
                    altinlar.splice(i, 1);
                } else if (altinlar[i].y > H + 50) {
                    altinlar.splice(i, 1);
                }
            }

            ciz();
            animasyon = requestAnimationFrame(oyunDongusu);
        }

        function ciz() {
            // Arka plan (çimen)
            ctx.fillStyle = "#1a3a1a";
            ctx.fillRect(0, 0, W, H);

            // Yol
            ctx.fillStyle = "#333";
            ctx.fillRect(YOL_SOL, 0, YOL_GENISLIK, H);

            // Yol kenarları
            ctx.fillStyle = "#ff4444";
            ctx.fillRect(YOL_SOL - 4, 0, 4, H);
            ctx.fillRect(YOL_SAG, 0, 4, H);

            // Beyaz şeritler
            ctx.fillStyle = "#fff";
            ctx.fillRect(YOL_SOL - 2, 0, 2, H);
            ctx.fillRect(YOL_SAG - 2, 0, 2, H);

            // Kesikli yol çizgisi
            ctx.fillStyle = "#ffd700";
            for (let y = -40 + yolCizgisiOffset; y < H; y += 40) {
                ctx.fillRect(W/2 - 3, y, 6, 20);
            }

            // Altınlar
            for (let a of altinlar) {
                ctx.fillStyle = "#ffd700";
                ctx.beginPath();
                ctx.arc(a.x + 10, a.y + 10, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#fff";
                ctx.font = "bold 14px Arial";
                ctx.textAlign = "center";
                ctx.fillText("$", a.x + 10, a.y + 15);
            }

            // Rakipler (kırmızı arabalar)
            for (let r of rakipler) {
                // Gövde
                ctx.fillStyle = "#ff3333";
                ctx.fillRect(r.x + 3, r.y + 8, 34, 54);
                // Tavan
                ctx.fillStyle = "#cc0000";
                ctx.fillRect(r.x + 8, r.y + 12, 24, 25);
                // Cam
                ctx.fillStyle = "#87ceeb";
                ctx.fillRect(r.x + 10, r.y + 14, 9, 14);
                ctx.fillRect(r.x + 21, r.y + 14, 9, 14);
                // Tekerlekler
                ctx.fillStyle = "#111";
                ctx.fillRect(r.x, r.y + 12, 6, 14);
                ctx.fillRect(r.x + 34, r.y + 12, 6, 14);
                ctx.fillRect(r.x, r.y + 44, 6, 14);
                ctx.fillRect(r.x + 34, r.y + 44, 6, 14);
                // Farlar
                ctx.fillStyle = "#ff0";
                ctx.fillRect(r.x + 8, r.y + 4, 6, 6);
                ctx.fillRect(r.x + 26, r.y + 4, 6, 6);
            }

            // Oyuncu arabası (mavi)
            // Gövde
            ctx.fillStyle = "#4488ff";
            ctx.fillRect(araba.x + 3, araba.y + 8, 34, 54);
            // Tavan
            ctx.fillStyle = "#2266dd";
            ctx.fillRect(araba.x + 8, araba.y + 12, 24, 25);
            // Cam
            ctx.fillStyle = "#87ceeb";
            ctx.fillRect(araba.x + 10, araba.y + 14, 9, 14);
            ctx.fillRect(araba.x + 21, araba.y + 14, 9, 14);
            // Tekerlekler
            ctx.fillStyle = "#111";
            ctx.fillRect(araba.x, araba.y + 12, 6, 14);
            ctx.fillRect(araba.x + 34, araba.y + 12, 6, 14);
            ctx.fillRect(araba.x, araba.y + 44, 6, 14);
            ctx.fillRect(araba.x + 34, araba.y + 44, 6, 14);
            // Farlar
            ctx.fillStyle = "#ff0";
            ctx.fillRect(araba.x + 8, araba.y + 4, 6, 6);
            ctx.fillRect(araba.x + 26, araba.y + 4, 6, 6);
        }

        function oyunuBitir() {
            oyunBitti = true;
            if (animasyon) cancelAnimationFrame(animasyon);

            if (skor > enIyi) {
                enIyi = skor;
                localStorage.setItem("yarisEnIyi2", enIyi);
                document.getElementById("eniyi").innerText = enIyi;
            }

            // Oyun bitti ekranı
            ctx.fillStyle = "rgba(0,0,0,0.75)";
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = "#ff4444";
            ctx.font = "bold 32px 'Segoe UI'";
            ctx.textAlign = "center";
            ctx.fillText("💥 OYUN BİTTİ!", W/2, H/2 - 25);
            ctx.fillStyle = "#ffd700";
            ctx.font = "22px 'Segoe UI'";
            ctx.fillText("Skor: " + skor, W/2, H/2 + 20);
            ctx.fillStyle = "#fff";
            ctx.font = "16px 'Segoe UI'";
            ctx.fillText("'Yeniden Başla' butonuna bas", W/2, H/2 + 55);
        }

        oyunuBaslat();
    </script>
</body>
</html>
