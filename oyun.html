<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Yılan Oyunu - Eymen</title>
    <style>
        body {
            margin: 0;
            background: #0d0d0d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            flex-direction: column;
            color: #e0e0e0;
        }

        h1 {
            color: #ffd700;
            text-shadow: 0 0 10px gold;
            margin-bottom: 10px;
        }

        canvas {
            border: 3px solid #c084fc;
            background: #111;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.5);
            display: block;
        }

        #score {
            font-size: 1.5em;
            margin-top: 10px;
            color: #ffd700;
        }

        button {
            background: #c084fc;
            color: #000;
            border: none;
            padding: 10px 25px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #ffd700;
            box-shadow: 0 0 15px gold;
        }

        p {
            color: #aaa;
            margin-top: 10px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>🐍 Yılan Oyunu</h1>
    <canvas id="oyunAlani" width="400" height="400"></canvas>
    <div id="score">Skor: 0</div>
    <button onclick="oyunuBaslat()">🔄 Yeniden Başla</button>
    <p>Yön tuşları ile oyna | Telefonda kaydır</p>

    <script>
        const canvas = document.getElementById("oyunAlani");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("score");

        let kareSayisi = 20;
        let kareBoyutu = canvas.width / kareSayisi;

        let yilan = [
            {x: 10, y: 10}
        ];
        let yon = {x: 1, y: 0};
        let yem = {x: 5, y: 5};
        let skor = 0;
        let oyunDongusu;
        let oyunHizi = 150;

        function oyunuBaslat() {
            yilan = [{x: 10, y: 10}];
            yon = {x: 1, y: 0};
            skor = 0;
            scoreText.innerText = "Skor: 0";
            yemOlustur();
            if (oyunDongusu) clearInterval(oyunDongusu);
            oyunDongusu = setInterval(oyunAdimi, oyunHizi);
        }

        function oyunAdimi() {
            // Yılanın başını güncelle
            let bas = {x: yilan[0].x + yon.x, y: yilan[0].y + yon.y};

            // Duvara çarpma kontrolü
            if (bas.x < 0 || bas.x >= kareSayisi || bas.y < 0 || bas.y >= kareSayisi) {
                return oyunBitti();
            }

            // Kendine çarpma kontrolü
            for (let parca of yilan) {
                if (parca.x === bas.x && parca.y === bas.y) {
                    return oyunBitti();
                }
            }

            // Yemi yedi mi?
            if (bas.x === yem.x && bas.y === yem.y) {
                skor += 10;
                scoreText.innerText = "Skor: " + skor;
                yemOlustur();
                // Yılanı uzatmak için kuyruğu silmiyoruz
            } else {
                // Yem yoksa kuyruğu kes
                yilan.pop();
            }

            // Başı ekle
            yilan.unshift(bas);

            // Çiz
            ciz();
        }

        function ciz() {
            // Arka plan
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Yılanı çiz
            ctx.fillStyle = "#c084fc";
            for (let parca of yilan) {
                ctx.fillRect(parca.x * kareBoyutu, parca.y * kareBoyutu, kareBoyutu - 2, kareBoyutu - 2);
            }

            // Yemi çiz
            ctx.fillStyle = "#ffd700";
            ctx.beginPath();
            ctx.arc(yem.x * kareBoyutu + kareBoyutu/2, yem.y * kareBoyutu + kareBoyutu/2, kareBoyutu/2 - 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function yemOlustur() {
            // Yılanın üzerine gelmeyen rastgele konum
            let yeniYem;
            do {
                yeniYem = {
                    x: Math.floor(Math.random() * kareSayisi),
                    y: Math.floor(Math.random() * kareSayisi)
                };
            } while (yilan.some(parca => parca.x === yeniYem.x && parca.y === yeniYem.y));
            yem = yeniYem;
        }

        function oyunBitti() {
            clearInterval(oyunDongusu);
            alert("Oyun Bitti! Skorun: " + skor);
        }

        // Klavye kontrolü
        window.addEventListener("keydown", (e) => {
            const tus = e.key;
            if (tus === "ArrowUp" && yon.y === 0) {
                yon = {x: 0, y: -1};
            } else if (tus === "ArrowDown" && yon.y === 0) {
                yon = {x: 0, y: 1};
            } else if (tus === "ArrowLeft" && yon.x === 0) {
                yon = {x: -1, y: 0};
            } else if (tus === "ArrowRight" && yon.x === 0) {
                yon = {x: 1, y: 0};
            }
        });

        // Mobil dokunmatik kontrol (basit kaydırma)
        let baslangicX, baslangicY;
        canvas.addEventListener("touchstart", (e) => {
            baslangicX = e.touches[0].clientX;
            baslangicY = e.touches[0].clientY;
        });
        canvas.addEventListener("touchend", (e) => {
            if (!baslangicX || !baslangicY) return;
            let bitisX = e.changedTouches[0].clientX;
            let bitisY = e.changedTouches[0].clientY;
            let diffX = bitisX - baslangicX;
            let diffY = bitisY - baslangicY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                // Yatay kaydırma
                if (diffX > 0 && yon.x === 0) yon = {x: 1, y: 0};
                else if (diffX < 0 && yon.x === 0) yon = {x: -1, y: 0};
            } else {
                // Dikey kaydırma
                if (diffY > 0 && yon.y === 0) yon = {x: 0, y: 1};
                else if (diffY < 0 && yon.y === 0) yon = {x: 0, y: -1};
            }
            baslangicX = null;
            baslangicY = null;
        });

        // İlk çizimi yap ve oyunu başlat
        oyunuBaslat();
    </script>
</body>
</html>
