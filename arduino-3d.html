<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏎️ 3D Arduino Yarış - AI Rakipler</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:#000;color:#e0e0e0;
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            overflow:hidden;
        }
        canvas{display:block;}
        .ust-panel{
            position:fixed;top:0;left:0;right:0;
            background:rgba(0,0,0,0.8);padding:12px 20px;
            display:flex;justify-content:space-between;align-items:center;
            z-index:100;border-bottom:2px solid #c084fc;
            flex-wrap:wrap;gap:10px;
        }
        .ust-panel h1{
            color:#ffd700;font-size:1.1em;text-shadow:0 0 10px gold;
        }
        .skorlar{display:flex;gap:15px;font-size:0.85em;flex-wrap:wrap;}
        .skor{color:#ffd700;font-weight:bold;}
        .eniyi{color:#c084fc;}
        .bolum{color:#4ade80;font-weight:bold;}
        .alt-panel{
            position:fixed;bottom:0;left:0;right:0;
            background:rgba(0,0,0,0.8);padding:12px;
            text-align:center;z-index:100;
            border-top:2px solid #c084fc;
        }
        .durum{
            color:#ff6b6b;font-weight:bold;margin-bottom:8px;
            font-size:0.9em;
        }
        .durum.bagli{color:#4ade80;}
        button{
            background:#c084fc;color:#000;border:none;
            padding:10px 20px;font-size:0.95em;border-radius:25px;
            cursor:pointer;font-weight:bold;margin:0 5px;
            transition:0.3s;
        }
        button:hover{background:#ffd700;box-shadow:0 0 15px gold;}
        button:disabled{opacity:0.5;cursor:not-allowed;}
        .zorluk-secim{
            position:fixed;top:50%;left:50%;
            transform:translate(-50%,-50%);
            background:rgba(0,0,0,0.95);
            border:3px solid #c084fc;border-radius:20px;
            padding:30px;text-align:center;z-index:200;
            box-shadow:0 0 40px rgba(192,132,252,0.5);
            display:none;
        }
        .zorluk-secim.aktif{display:block;}
        .zorluk-secim h2{
            color:#ffd700;margin-bottom:20px;
            text-shadow:0 0 10px gold;
        }
        .zorluk-btn{
            display:block;width:200px;
            margin:10px auto;padding:15px;
            border-radius:15px;border:none;
            font-size:1.1em;font-weight:bold;
            cursor:pointer;transition:0.3s;
            color:#fff;
        }
        .zorluk-kolay{background:linear-gradient(45deg,#4ade80,#22c55e);}
        .zorluk-normal{background:linear-gradient(45deg,#f59e0b,#ffd700);color:#000 !important;}
        .zorluk-zor{background:linear-gradient(45deg,#ff4444,#cc0000);}
        .zorluk-btn:hover{transform:scale(1.05);box-shadow:0 0 20px gold;}
        .bolum-mesaj{
            position:fixed;top:50%;left:50%;
            transform:translate(-50%,-50%);
            background:rgba(0,0,0,0.9);
            border:3px solid #ffd700;border-radius:20px;
            padding:30px 60px;text-align:center;
            z-index:150;display:none;
            box-shadow:0 0 50px gold;
            pointer-events:none;
        }
        .bolum-mesaj.aktif{
            display:block;
            animation:bolumAnim 0.5s ease;
        }
        .bolum-mesaj h2{
            color:#ffd700;font-size:2.2em;
            text-shadow:0 0 15px gold;
            margin-bottom:10px;
        }
        .bolum-mesaj p{color:#c084fc;font-size:1.2em;}
        @keyframes bolumAnim{
            from{transform:translate(-50%,-50%) scale(0.5);opacity:0;}
            to{transform:translate(-50%,-50%) scale(1);opacity:1;}
        }
        .bilgi{
            position:fixed;top:70px;left:20px;
            background:rgba(0,0,0,0.6);padding:10px;
            border-radius:10px;font-size:0.8em;
            color:#c084fc;z-index:100;
        }
    </style>
</head>
<body>
    <div class="ust-panel">
        <h1>🏎️ 3D Arduino Yarış - AI</h1>
        <div class="skorlar">
            <span class="bolum">📊 Bölüm: <span id="bolum">1</span></span>
            <span class="skor">🏆 Skor: <span id="skor">0</span></span>
            <span class="eniyi">👑 En İyi: <span id="eniyi">0</span></span>
        </div>
    </div>

    <div class="bilgi">
        🎮 Potansiyometreyi çevir<br>
        🚗 Arabayı kontrol et<br>
        🧠 Rakipler akıllı!
    </div>

    <div class="alt-panel">
        <div class="durum" id="durum">🔌 Arduino'ya Bağlan</div>
        <button id="baglanBtn" onclick="arduinoBaglan()">🔌 Bağlan</button>
        <button id="baslatBtn" onclick="zorlukSecimGoster()" disabled>🎮 Yeni Oyun</button>
    </div>

    <div class="zorluk-secim" id="zorlukSecim">
        <h2>🎯 Zorluk Seç</h2>
        <button class="zorluk-btn zorluk-kolay" onclick="oyunuBaslat('kolay')">😊 Kolay</button>
        <button class="zorluk-btn zorluk-normal" onclick="oyunuBaslat('normal')">😎 Normal</button>
        <button class="zorluk-btn zorluk-zor" onclick="oyunuBaslat('zor')">😈 Zor</button>
    </div>

    <div class="bolum-mesaj" id="bolumMesaj">
        <h2 id="bolumMesajBaslik">🎉 Bölüm 2!</h2>
        <p id="bolumMesajAlt">Daha hızlı, daha zor!</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ==================== THREE.JS KURULUM ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 50, 150);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // Zemin
        const zeminGeo = new THREE.PlaneGeometry(200, 200);
        const zeminMat = new THREE.MeshStandardMaterial({ color: 0x1a3a1a });
        const zemin = new THREE.Mesh(zeminGeo, zeminMat);
        zemin.rotation.x = -Math.PI / 2;
        zemin.position.y = -0.01;
        zemin.receiveShadow = true;
        scene.add(zemin);

        const yolGeo = new THREE.PlaneGeometry(10, 200);
        const yolMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const yol = new THREE.Mesh(yolGeo, yolMat);
        yol.rotation.x = -Math.PI / 2;
        scene.add(yol);

        const cizgiMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 0.3 });
        const cizgiler = [];
        for (let i = 0; i < 50; i++) {
            const cizgiGeo = new THREE.PlaneGeometry(0.3, 2);
            const cizgi = new THREE.Mesh(cizgiGeo, cizgiMat);
            cizgi.rotation.x = -Math.PI / 2;
            cizgi.position.set(0, 0.01, -i * 4);
            scene.add(cizgi);
            cizgiler.push(cizgi);
        }

        const seritMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const seritSolGeo = new THREE.PlaneGeometry(0.3, 200);
        const seritSol = new THREE.Mesh(seritSolGeo, seritMat);
        seritSol.rotation.x = -Math.PI / 2;
        seritSol.position.set(-5, 0.01, 0);
        scene.add(seritSol);
        const seritSag = new THREE.Mesh(seritSolGeo, seritMat);
        seritSag.rotation.x = -Math.PI / 2;
        seritSag.position.set(5, 0.01, 0);
        scene.add(seritSag);

        // ==================== ARABA ====================
        function arabaYap(renk) {
            const araba = new THREE.Group();
            const govdeGeo = new THREE.BoxGeometry(1.8, 0.8, 3.5);
            const govdeMat = new THREE.MeshStandardMaterial({ color: renk, metalness: 0.5, roughness: 0.3 });
            const govde = new THREE.Mesh(govdeGeo, govdeMat);
            govde.position.y = 0.6;
            govde.castShadow = true;
            araba.add(govde);

            const tavanGeo = new THREE.BoxGeometry(1.4, 0.6, 1.8);
            const tavanMat = new THREE.MeshStandardMaterial({ color: renk, metalness: 0.5, roughness: 0.3 });
            const tavan = new THREE.Mesh(tavanGeo, tavanMat);
            tavan.position.set(0, 1.3, -0.2);
            tavan.castShadow = true;
            araba.add(tavan);

            const camGeo = new THREE.BoxGeometry(1.3, 0.5, 0.1);
            const camMat = new THREE.MeshStandardMaterial({ color: 0x87ceeb, transparent: true, opacity: 0.6 });
            const camOn = new THREE.Mesh(camGeo, camMat);
            camOn.position.set(0, 1.3, 0.7);
            araba.add(camOn);

            const tekerlekGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            const tekerlekMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            [[-0.9, 0.4, 1.2], [0.9, 0.4, 1.2], [-0.9, 0.4, -1.2], [0.9, 0.4, -1.2]].forEach(pos => {
                const tekerlek = new THREE.Mesh(tekerlekGeo, tekerlekMat);
                tekerlek.rotation.z = Math.PI / 2;
                tekerlek.position.set(pos[0], pos[1], pos[2]);
                tekerlek.castShadow = true;
                araba.add(tekerlek);
            });

            const farGeo = new THREE.BoxGeometry(0.3, 0.2, 0.1);
            const farMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00, emissiveIntensity: 0.5 });
            const farSol = new THREE.Mesh(farGeo, farMat);
            farSol.position.set(-0.6, 0.6, 1.8);
            araba.add(farSol);
            const farSag = new THREE.Mesh(farGeo, farMat);
            farSag.position.set(0.6, 0.6, 1.8);
            araba.add(farSag);

            return araba;
        }

        const oyuncuAraba = arabaYap(0x4488ff);
        oyuncuAraba.position.set(0, 0, 5);
        scene.add(oyuncuAraba);

        // ==================== BİNALAR ====================
        const binalar = [];
        function binaOlustur() {
            const genislik = 2 + Math.random() * 3;
            const yukseklik = 3 + Math.random() * 8;
            const derinlik = 2 + Math.random() * 3;
            const renk = new THREE.Color().setHSL(Math.random() * 0.2 + 0.5, 0.5, 0.4);
            const binaGeo = new THREE.BoxGeometry(genislik, yukseklik, derinlik);
            const binaMat = new THREE.MeshStandardMaterial({ color: renk });
            const bina = new THREE.Mesh(binaGeo, binaMat);
            const taraf = Math.random() > 0.5 ? 1 : -1;
            bina.position.set(taraf * (10 + Math.random() * 15), yukseklik / 2, -100 - Math.random() * 50);
            bina.castShadow = true;
            bina.receiveShadow = true;
            scene.add(bina);
            binalar.push(bina);
        }
        for (let i = 0; i < 30; i++) binaOlustur();

        // ==================== YAPAY ZEKA RAKİP SINIFI ====================
        class AIRakip {
            constructor(tip) {
                this.tip = tip;
                this.mesh = arabaYap(this.tipRenk());
                this.mesh.position.set(-4 + Math.random() * 8, 0, -100);
                scene.add(this.mesh);
                
                this.hedefX = this.mesh.position.x;
                this.hiz = 0.5;
                this.zeka = 0.5;
                this.seritDegistirmeZaman = 0;
                this.zikzakYon = 1;
                
                if (tip === "agresif") {
                    this.hiz = 0.8;
                    this.zeka = 1.0;
                } else if (tip === "zikzak") {
                    this.hiz = 0.6;
                    this.zeka = 0.3;
                } else if (tip === "hizli") {
                    this.hiz = 1.2;
                    this.zeka = 0.7;
                } else {
                    this.hiz = 0.5;
                    this.zeka = 0.5;
                }
            }

            tipRenk() {
                if (this.tip === "agresif") return 0xff0000;
                if (this.tip === "zikzak") return 0xff8800;
                if (this.tip === "hizli") return 0xff00ff;
                return 0xff3333;
            }

            guncelle(oyuncuX, hiz, rakipler) {
                if (this.zeka > 0.5) {
                    this.hedefX = oyuncuX;
                } else if (this.tip === "zikzak") {
                    this.seritDegistirmeZaman++;
                    if (this.seritDegistirmeZaman > 30) {
                        this.zikzakYon *= -1;
                        this.seritDegistirmeZaman = 0;
                    }
                    this.hedefX += this.zikzakYon * 0.15;
                } else {
                    this.seritDegistirmeZaman++;
                    if (this.seritDegistirmeZaman > 60) {
                        this.hedefX = -4 + Math.random() * 8;
                        this.seritDegistirmeZaman = 0;
                    }
                }

                if (this.zeka > 0.7) {
                    rakipler.forEach(diger => {
                        if (diger === this) return;
                        const dx = this.mesh.position.x - diger.mesh.position.x;
                        const dz = this.mesh.position.z - diger.mesh.position.z;
                        if (Math.abs(dz) < 5 && Math.abs(dx) < 2) {
                            this.hedefX += dx > 0 ? 0.2 : -0.2;
                        }
                    });
                }

                if (this.hedefX < -4) this.hedefX = -4;
                if (this.hedefX > 4) this.hedefX = 4;

                this.mesh.position.x += (this.hedefX - this.mesh.position.x) * 0.1;
                this.mesh.position.z += hiz * this.hiz;
            }

            temizle() {
                scene.remove(this.mesh);
            }
        }

        // ==================== OYUN DEĞİŞKENLERİ ====================
        let rakipler = [];
        let skor = 0;
        let enIyi = parseInt(localStorage.getItem("arduino3DEnIyi") || "0");
        let oyunBitti = false;
        let hiz = 0.5;
        let arduinoDeger = 512;
        let arduinoBagli = false;
        let port = null;
        let reader = null;
        let rakipZaman = 0;
        let oyunAktif = false;
        
        let zorluk = "normal";
        let zorlukAyarlari = {
            kolay: { hiz: 0.4, rakipSiklik: 150, hizArtis: 0.05, bolumSkor: 700 },
            normal: { hiz: 0.6, rakipSiklik: 100, hizArtis: 0.1, bolumSkor: 500 },
            zor: { hiz: 0.9, rakipSiklik: 60, hizArtis: 0.15, bolumSkor: 400 }
        };
        
        let bolum = 1;
        let sonBolumSkoru = 0;

        document.getElementById("eniyi").innerText = enIyi;

        // ==================== ARDUINO BAĞLANTISI ====================
        async function arduinoBaglan() {
            const durum = document.getElementById("durum");
            if (!("serial" in navigator)) {
                durum.innerText = "❌ Web Serial desteklenmiyor!";
                return;
            }
            try {
                durum.innerText = "🔌 Bağlanıyor...";
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                arduinoBagli = true;
                durum.innerText = "✅ Arduino Bağlı!";
                durum.className = "durum bagli";
                document.getElementById("baglanBtn").disabled = true;
                document.getElementById("baslatBtn").disabled = false;
                okumayaBasla();
                zorlukSecimGoster();
            } catch (err) {
                durum.innerText = "❌ Hata: " + err.message;
            }
        }

        async function okumayaBasla() {
            const textDecoder = new TextDecoderStream();
            port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();
            let tampon = "";
            while (true) {
                try {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        tampon += value;
                        const satirlar = tampon.split("\n");
                        tampon = satirlar.pop();
                        for (const satir of satirlar) {
                            const deger = parseInt(satir.trim());
                            if (!isNaN(deger)) arduinoDeger = deger;
                        }
                    }
                } catch (err) { break; }
            }
        }

        function zorlukSecimGoster() {
            document.getElementById("zorlukSecim").classList.add("aktif");
        }

        // ==================== OYUN ====================
        function oyunuBaslat(seciliZorluk) {
            zorluk = seciliZorluk || "normal";
            document.getElementById("zorlukSecim").classList.remove("aktif");
            
            rakipler.forEach(r => r.temizle());
            rakipler = [];
            
            oyuncuAraba.position.set(0, 0, 5);
            skor = 0;
            bolum = 1;
            sonBolumSkoru = 0;
            oyunBitti = false;
            oyunAktif = true;
            hiz = zorlukAyarlari[zorluk].hiz;
            rakipZaman = 0;
            
            document.getElementById("skor").innerText = "0";
            document.getElementById("bolum").innerText = "1";
        }

        function rakipOlustur() {
            const tipler = ["normal", "agresif", "zikzak", "hizli"];
            let tip;
            
            if (bolum < 2) {
                tip = "normal";
            } else if (bolum < 4) {
                tip = tipler[Math.floor(Math.random() * 2)];
            } else {
                tip = tipler[Math.floor(Math.random() * tipler.length)];
            }
            
            const rakip = new AIRakip(tip);
            rakipler.push(rakip);
        }

        function carpismaKontrol(a, b) {
            const dx = Math.abs(a.position.x - b.position.x);
            const dz = Math.abs(a.position.z - b.position.z);
            return dx < 1.5 && dz < 2.5;
        }

        function bolumGecisi() {
            bolum++;
            document.getElementById("bolum").innerText = bolum;
            document.getElementById("bolumMesajBaslik").innerText = "🎉 Bölüm " + bolum + "!";
            
            let mesaj = "";
            if (bolum === 2) mesaj = "Daha hızlı, daha zor!";
            else if (bolum === 3) mesaj = "Artık ustalaşıyorsun!";
            else if (bolum === 4) mesaj = "Bu iş ciddileşiyor...";
            else if (bolum === 5) mesaj = "Efsane oluyorsun!";
            else if (bolum >= 6) mesaj = "Sen bir efsanesin! 🔥";
            document.getElementById("bolumMesajAlt").innerText = mesaj;
            
            // Mesajı göster (2 saniye sonra kendiliğinden kaybolur)
            document.getElementById("bolumMesaj").classList.add("aktif");
            setTimeout(() => {
                document.getElementById("bolumMesaj").classList.remove("aktif");
            }, 2000);
            
            // Hız anında artar, oyun DURMAZ
            hiz += zorlukAyarlari[zorluk].hizArtis * 2;
        }

        // ==================== ANİMASYON ====================
        function animate() {
            requestAnimationFrame(animate);
            
            if (oyunAktif && !oyunBitti) {
                const oran = 1 - (arduinoDeger / 1023);
                const hedefX = -4 + oran * 8;
                oyuncuAraba.position.x += (hedefX - oyuncuAraba.position.x) * 0.2;
                if (oyuncuAraba.position.x < -4) oyuncuAraba.position.x = -4;
                if (oyuncuAraba.position.x > 4) oyuncuAraba.position.x = 4;

                skor += Math.floor(hiz * 10);
                document.getElementById("skor").innerText = skor;
                
                if (skor - sonBolumSkoru >= zorlukAyarlari[zorluk].bolumSkor) {
                    sonBolumSkoru = skor;
                    bolumGecisi();
                }
                
                camera.position.x = oyuncuAraba.position.x * 0.5;
                camera.position.z = oyuncuAraba.position.z + 10;
                camera.position.y = 5;
                camera.lookAt(oyuncuAraba.position.x, 1, oyuncuAraba.position.z - 10);

                cizgiler.forEach(cizgi => {
                    cizgi.position.z += hiz;
                    if (cizgi.position.z > 10) cizgi.position.z -= 200;
                });

                binalar.forEach(bina => {
                    bina.position.z += hiz;
                    if (bina.position.z > 10) {
                        bina.position.z = -100 - Math.random() * 50;
                        const taraf = Math.random() > 0.5 ? 1 : -1;
                        bina.position.x = taraf * (10 + Math.random() * 15);
                        bina.position.y = (3 + Math.random() * 8) / 2;
                    }
                });

                rakipZaman += hiz;
                if (rakipZaman > zorlukAyarlari[zorluk].rakipSiklik - bolum * 5) {
                    rakipOlustur();
                    rakipZaman = 0;
                }

                for (let i = rakipler.length - 1; i >= 0; i--) {
                    const r = rakipler[i];
                    r.guncelle(oyuncuAraba.position.x, hiz, rakipler);
                    
                    if (carpismaKontrol(oyuncuAraba, r.mesh)) {
                        oyunBitir();
                        return;
                    }
                    if (r.mesh.position.z > 15) {
                        r.temizle();
                        rakipler.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function oyunBitir() {
            oyunBitti = true;
            oyunAktif = false;
            
            if (skor > enIyi) {
                enIyi = skor;
                localStorage.setItem("arduino3DEnIyi", enIyi);
                document.getElementById("eniyi").innerText = enIyi;
            }
            
            setTimeout(() => {
                alert("💥 Oyun Bitti!\n\nSkor: " + skor + "\nBölüm: " + bolum + "\nZorluk: " + zorluk.toUpperCase());
            }, 100);
        }

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
